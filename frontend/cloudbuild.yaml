steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_API_BASE_URL=${_VITE_API_BASE_URL}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _VITE_API_BASE_URL: http://localhost:8000
  _IMAGE: us-central1-docker.pkg.dev/example-project/seo-platform/frontend:latest
