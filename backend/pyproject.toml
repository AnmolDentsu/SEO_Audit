[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-ai-platform-backend"
version = "0.1.0"
description = "FastAPI SEO analysis backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.40,<3",
  "alembic>=1.16,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "playwright>=1.53,<2",
  "beautifulsoup4>=4.13,<5",
  "lxml>=5.4,<7",
  "httpx>=0.28,<1",
  "tenacity>=9.1,<10",
  "openpyxl>=3.1.5,<4",
  "curl-cffi>=0.16.3,<1",
  "google-auth>=2.40,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "tldextract>=5,<6",
  "google-genai>=2.23,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
